[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smai"
version = "0.1.0"
description = "SMAI: Local-first autonomous agentic studio for faceless Instagram Reels, Carousels, and Stories."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "apscheduler>=3.10.4",
    "pyyaml>=6.0.2",
    "pillow>=10.4.0",
    "edge-tts>=6.1.12",
    "imageio-ffmpeg>=0.5.1",
    "playwright>=1.47.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
smai = "smai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smai = ["templates/**/*.html", "templates/**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
